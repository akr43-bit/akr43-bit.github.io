<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Fixed Spacing Glow Button</title>
    <style>
        body {
            margin: 0;
            background-color: #080511; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }

        /* 🔒 স্থির নিওন বর্ডার কন্টেনার */
        .btn-static-wrapper {
            position: relative;
            padding: 3px;
            border-radius: 50px;
            background: #8a2be2;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.6);
            display: inline-block;
            margin: 0 auto;
            transition: transform 0.2s;
        }

        /* ✂️ মেইন ডার্ক পার্পল বাটন */
        .portfolio-btn-magic {
            position: relative;
            padding: 13px 35px; 
            background: #11052C; 
            border: none;
            border-radius: 50px;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 🔒 টেক্সট এরিয়া: মোট ১৪.৪ সেকেন্ডের ফিক্সড অ্যানিমেশন (forwards যাতে শেষ ফ্রেমে চিরতরে আটকে যায়) */
        .text-glow {
            display: inline-block;
            font-size: 18px; 
            font-weight: 800; 
            color: #ffffff;
            text-transform: uppercase;
            width: 240px; /* ফন্ট সাইজ বড় হলেও টেক্সট যাতে এক লাইনে স্থির থাকে */
            text-align: center;
            letter-spacing: 1px;
            line-height: 1.2;
            /* কোডটি ১৪.৪ সেকেন্ড চলে নিজে থেকেই শেষ ফ্রেমে লক হয়ে যাবে */
            animation: changePremiumFontsFast 14.4s forwards steps(1); 
        }

        /* আলোর আভা: এটিও ঠিক ১৪.৪ সেকেন্ড (১.২ সে. × ১২ বার আলো = ১৪.৪ সেকেন্ড) চলে নিজে থেকে চিরতরে বন্ধ হয়ে যাবে */
        .portfolio-btn-magic::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 80%; 
            height: 100%;
            background: linear-gradient(
                90deg, 
                transparent, 
                rgba(0, 255, 204, 0.4), 
                rgba(255, 255, 255, 0.7), 
                rgba(218, 112, 214, 0.4), 
                transparent
            );
            transform: skewX(-25deg);
            /* ১২ বার আলোর ঝলকানি দিয়ে forwards মোডে এটি নিজে থেকেই স্টপ হয়ে যাবে */
            animation: turboLight 1.2s 12 forwards linear;
        }

        /* 🎯 ১৪.৪ সেকেন্ড পর অ্যানিমেশন সম্পূর্ণ স্টপ হয়ে বাটন যখন রেডি হবে তখনকার ক্লিকেবল গ্লো স্টাইল */
        .btn-static-wrapper.ready-to-click {
            background: #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.9);
            cursor: pointer;
        }
        .btn-static-wrapper.ready-to-click .portfolio-btn-magic {
            background: #080511;
        }
        .btn-static-wrapper.ready-to-click .text-glow {
            color: #00ffcc;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.8);
            font-family: 'Arial Black', 'Impact', sans-serif !important; 
            font-size: 18px; /* ফাইনাল ক্লিকেবল বাটনে লেখাটি আবার স্ট্যান্ডার্ড প্রফেশনাল ১৮px লুকে ফিরে আসবে */
            letter-spacing: 2px;
            opacity: 1 !important; /* ভ্যানিশ হওয়া খালি জায়গায় আসল সুন্দর লেখা ফুটে উঠবে */
        }

        .btn-static-wrapper:hover {
            transform: scale(1.04);
        }

        @keyframes turboLight {
            0% { left: -150%; }
            100% { left: 150%; }
        }

        /* 🌟 শুরুর ডিফল্ট রূপ + ৪ বার পরিবর্তন এবং শেষে লেখা মুছে অতিরিক্ত আলো চলার গাণিতিক লজিক */
        @keyframes changePremiumFontsFast {
            0%, 16.65% { 
                font-family: 'Impact', 'Arial Black', sans-serif;
                font-size: 18px;
                text-shadow: 0 0 10px #da70d6;
                letter-spacing: 1.5px;
                opacity: 1;
            }
            16.66%, 33.32% { 
                font-family: 'Georgia', serif;
                font-style: italic;
                font-weight: bold;
                font-size: 17px;
                text-shadow: 0 0 10px #00ffcc;
                letter-spacing: 0.5px;
                opacity: 1;
            }
            33.33%, 49.99% { 
                font-family: 'Trebuchet MS', sans-serif;
                font-size: 18px;
                text-shadow: 0 0 10px #8a2be2;
                letter-spacing: 1px;
                opacity: 1;
            }
            50%, 66.65% { 
                font-family: 'Courier New', Courier, monospace;
                font-weight: 900;
                font-size: 18px;
                text-shadow: 0 0 10px #ffffff;
                letter-spacing: 0.5px;
                opacity: 1;
            }
            66.66%, 83.32% { 
                font-family: 'Arial Black', 'Impact', sans-serif;
                font-size: 24px; 
                font-weight: 900;
                text-shadow: 0 0 15px #ff007f; 
                letter-spacing: 0.5px;
                opacity: 1;
            }
            83.33%, 100% {
                opacity: 0; 
            }
        }
    </style>
</head>
<body>

    <div class="btn-static-wrapper" id="btnWrapper">
        <button class="portfolio-btn-magic" id="magicBtn" onclick="openPortfolio()">
            <span class="text-glow" id="btnText">View My Portfolio</span>
        </button>
    </div>

    <script>
        let isReadyToClick = false; 

        // ঠিক ১৪.৪ সেকেন্ড (১৪৪০০ মিলিসেকেন্ড) পূর্ণ হলে লুপ চিরতরে স্টপ হবে এবং বাটন লক হবে
        setTimeout(() => {
            const wrapper = document.getElementById('btnWrapper');
            const text = document.getElementById('btnText');
            
            text.innerText = "VIEW PORTFOLIO"; 
            wrapper.classList.add('ready-to-click'); 
            isReadyToClick = true; 
        }, 14400); 

        // 🔗 এখানে আপনার আসল GitHub Pages লিঙ্কটি সঠিকভাবে বসিয়ে দেওয়া হয়েছে
        function openPortfolio() {
            if (isReadyToClick) {
                const myPortfolioLink = "https://akr43-bit.github.io/"; 
                window.open(myPortfolioLink, "_blank");
            } else {
                console.log("দয়া করে জাদুকরী অ্যানিমেশনটি শেষ হওয়া পর্যন্ত অপেক্ষা করুন!");
            }
        }
    </script>

</body>
</html>
