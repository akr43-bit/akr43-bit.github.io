<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Clickable Email Signature - Asim Krishna Roy</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 40px;
  background: #f4f7f6;
  font-family: "Segoe UI", system-ui, sans-serif;
}

#premium-sig-root {
  max-width: 480px;
  width: 100%;
  margin: 0 auto;
  background: #ffffff;
  padding: 40px;
  border-radius: 16px;
  box-shadow: 0 8px 24px rgba(0,0,0,.06);
  border: 1px solid #eaeaea;
  text-align: center;
}

.top-banner {
  width: 100%;
  height: 44px;
  background: #000;
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  align-items: center;
  position: relative;
  box-shadow: inset 0 0 10px rgba(255,255,255,.15);
  margin: 0 auto 18px;
}

.banner-text {
  position: absolute;
  white-space: nowrap;
  font-size: 15px;
  font-weight: 700;
  color: #ffdf00;
  letter-spacing: .8px;
  animation: instantLoop 20s infinite linear;
  padding-left: 100%;
}

@keyframes instantLoop {
  0% { transform: translateX(0%); }
  100% { transform: translateX(-100%); }
}

.profile-table {
  width: 100%;
  margin: 0 auto 18px;
  border-collapse: collapse;
  text-align: left;
}

.photo-cell {
  width: 85px;
  vertical-align: middle;
}

.profile-photo {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  border: 2.5px solid #000;
  overflow: hidden;
  background: #fafafa;
  box-shadow: 0 4px 12px rgba(0,0,0,.1);
  object-fit: cover;
  display: block;
}

.profile-info {
  vertical-align: middle;
  padding-left: 14px;
  overflow-wrap: anywhere;
}

.profile-info h3 {
  margin: 0 0 4px;
  color: #000;
  font-size: 21px;
  font-weight: 700;
  letter-spacing: .3px;
  line-height: 1.2;
}

.job-title {
  margin: 0 0 6px;
  color: #0284c7;
  font-size: 13.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.glowing-service-text {
  margin: 0;
  font-size: 15px;
  line-height: 1.4;
  font-weight: 800;
  letter-spacing: .1px;
  background: linear-gradient(
    90deg, #111 0%, #111 25%, #00f2fe 45%,
    #fff 50%, #00f2fe 55%, #111 75%, #111 100%
  );
  background-size: 250% auto;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: textShine 3s linear infinite;
}

@keyframes textShine {
  0% { background-position: 250% center; }
  100% { background-position: -250% center; }
}

/* Keep all contact sections inside the container */
.contact-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 0;
  table-layout: fixed;
}

.contact-cell,
.qr-cell,
.taj-pair-cell {
  border-top: 1px dashed #e5e7eb;
  padding-top: 18px;
  vertical-align: middle;
}

.contact-cell {
  width: 30%;
  text-align: left;
}

.taj-pair-cell {
  width: 52%;
  text-align: center;
  padding-left: 2px;
  padding-right: 2px;
}

.qr-cell {
  width: 18%;
  text-align: right;
}

.call-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  background: #000;
  color: #fff;
  text-decoration: none;
  padding: 11px 10px;
  font-size: 12px;
  font-weight: 700;
  border-radius: 25px;
  letter-spacing: .2px;
  box-shadow: 0 4px 12px rgba(0,0,0,.15);
  cursor: pointer;
  border: none;
}

.call-btn:hover {
  background: #263238;
}

.qr-frame {
  width: 56px;
  height: 56px;
  padding: 3px;
  border: 1.5px solid #000;
  border-radius: 8px;
  background: #fff;
  display: inline-block;
  box-shadow: 0 3px 8px rgba(0,0,0,.06);
}

.qr-frame img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}

.taj-pair {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 4px;
  width: 100%;
  min-width: 0;
}

.taj-image {
  display: block;
  flex: 1 1 0;
  width: 0;
  min-width: 0;
  max-width: 90px;
  height: 55px;
  object-fit: cover;
  border-radius: 7px;
  border: 1px solid #ddd;
  margin: 0;
}

/* Move the bottom charcoal container down by another 10px */
.portfolio-container {
  width: 100%;
  margin: 38px auto 0;
  padding: 8px;
  background: #1e293b;
  border-radius: 8px;
  box-shadow: 0 4px 12px rgba(30,41,59,.25);
  text-align: center;
}

.portfolio-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg,#6e8efb,#a777e3);
  color: #fff;
  text-decoration: none;
  padding: 14px 32px;
  font-size: 16px;
  font-weight: 600;
  border-radius: 50px;
  box-shadow: 0 4px 15px rgba(110,142,251,.4);
  transition: all .3s ease;
  position: relative;
  overflow: hidden;
  max-width: 100%;
}

.portfolio-btn span {
  margin-right: 8px;
  transition: transform .3s ease;
}

.arrow-icon {
  flex-shrink: 0;
  transition: transform .3s ease;
}

.portfolio-btn:hover {
  background: linear-gradient(135deg,#a777e3,#6e8efb);
  box-shadow: 0 6px 20px rgba(167,119,227,.6);
  transform: translateY(-3px);
}

.portfolio-btn:hover .arrow-icon {
  transform: translateX(5px);
}

.portfolio-btn:hover span {
  transform: translateX(-2px);
}

.portfolio-btn:active {
  transform: translateY(-1px);
  box-shadow: 0 3px 10px rgba(110,142,251,.4);
}

@media (max-width: 410px) {
  body {
    padding: 20px 10px;
  }

  #premium-sig-root {
    padding: 40px;
  }

  .profile-info h3 {
    font-size: 18px;
  }

  .profile-info {
    padding-left: 10px;
  }

  .taj-pair {
    gap: 2px;
  }

  .taj-image {
    height: 45px;
  }

  .call-btn {
    padding: 10px 5px;
    font-size: 10px;
  }

  .qr-frame {
    width: 48px;
    height: 48px;
  }

  .portfolio-btn {
    padding: 12px 24px;
    font-size: 15px;
  }
}
</style>
</head>

<body>
<div id="premium-sig-root">

  <div class="top-banner">
    <div class="banner-text">
      ★ Mr. Asim Krishna Roy ✿
      <span style="color:#fff;">★ Online Marketing Specialist ✿</span>
      <span style="color:#a7f3d0;font-style:italic;font-weight:800;">
        ★ Clickable Email Signature with Digital Business Card ✿
      </span>
    </div>
  </div>

  <table class="profile-table" cellpadding="0" cellspacing="0">
    <tbody>
      <tr>
        <td class="photo-cell">
          <img
            class="profile-photo"
            src="https://i.postimg.cc/K4XqYGKj/f2626ef5-74cc-4681-b0b1-c913b7dcc139-20260715-145941-0000.png"
            alt="Mr. Asim Krishna Roy">
        </td>

        <td class="profile-info">
          <h3>Mr. Asim Krishna Roy</h3>
          <p class="job-title">Online Marketing Specialist</p>
          <p class="glowing-service-text">
            Clickable Email Signature with Digital Business Card
          </p>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Call button, two Taj Mahal images and QR frame -->
  <table class="contact-table" cellpadding="0" cellspacing="0">
    <tbody>
      <tr>
        <td class="contact-cell">
          <button type="button" class="call-btn"
            onclick="choosePhoneNumber()">
            <span style="margin-right:4px;font-size:13px;">📞</span>
            Click to Call
          </button>
        </td>

        <td class="taj-pair-cell">
          <div class="taj-pair">
            <img
              class="taj-image"
              src="https://raw.githubusercontent.com/akr43-bit/akr43-bit.github.io/main/Images/ip-QEJI4cI3anszFwuExZh-S99WirufwahoSUXA6ijPW8hZihAbfxXeB4tJx-McDISCnoBYmfzFv_4detzOi2LtmZ5PG4eHVEC6WR5SRZaCBsflWYSN7FDxxmnwCyb0nqWLNRugnqT4jv7TQ8BS4CT7mLYjpJmeFsmYN2r5-7SANkUGIGU-fvK1eALIBMwqb.jpeg"
              alt="White Taj Mahal">

            <img
              class="taj-image"
              src="https://raw.githubusercontent.com/akr43-bit/akr43-bit.github.io/main/Images/taj-mahal-evening-agra-india-view-early-light-built-mughal-emperor-shah-jahan-memory-his-wife-mumtaz-uttar-88477560.jpg"
              alt="Red Taj Mahal">
          </div>
        </td>

        <td class="qr-cell">
          <div class="qr-frame">
            <img src="https://postimg.cc" alt="QR Code">
          </div>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="portfolio-container">
    <a
      href="https://akr43-bit.github.io/"
      class="portfolio-btn"
      target="_blank"
      rel="noopener noreferrer">
      <span>View My Portfolio</span>
      <svg
        class="arrow-icon"
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>
  </div>

</div>

<script>
function choosePhoneNumber() {
  const choice = confirm(
    "Choose a number to call:\n\n" +
    "Press OK for Main Number (+91 9775116933)\n" +
    "Press CANCEL for Second Number (+91 7063320748)"
  );

  if (choice) {
    window.location.href = "tel:+919775116933";
  } else {
    window.location.href = "tel:+917063320748";
  }
}
</script>
</body>
</html>
