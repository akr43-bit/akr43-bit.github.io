<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Asim Krishna Roy - Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffd700;
            box-shadow: 0 0 15px #ffd700;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 24px;
            color: #ffd700;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 14px;
            color: #e0e0e0;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .links-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .shop-btn {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 15px;
            font-weight: bold;
            color: #0f2027;
            background: linear-gradient(90deg, #ffe259, #ffa751);
            text-decoration: none;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
        }
        /* গোল্ডেন শাইন অ্যানিমেশন */
        .shop-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            transition: none;
        }
        .shop-btn:active {
            transform: scale(0.98);
        }
        /* অটোমেটিক অ্যানিমেশন লুপ */
        @keyframes shine {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        .shop-btn {
            animation: pulse 2s infinite alternate;
        }
        .shop-btn::before {
            animation: glow 3s infinite;
        }
        @keyframes glow {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- প্রোফাইল ফটো বক্স -->
        <img class="profile-img" src="YOUR_PHOTO_URL_HERE" alt="Mr. Asim Krishna Roy">
        
        <!-- আপনার নাম ও পদবী -->
        <h1>Mr. Asim Krishna Roy</h1>
        <div class="subtitle">Online Marketing Specialist</div>
        
        <!-- ১০টি সচল শপিং সাইটের গোল্ডেন বাটন লিংক -->
        <div class="links-area">
            <a class="shop-btn" href="https://google.com" target="_blank">Best Dealing Shop - H</a>
            <a class="shop-btn" href="https://google.com" target="_blank">Best Dealing Shop - I</a>
            <a class="shop-btn" href="https://google.com" target="_blank">Best Dealing Shop - J</a>
            <a class="shop-btn" href="https://google.com" target="_blank">Best Shopping Site - K</a>
            <a class="shop-btn" href="https://google.com" target="_blank">Best Shopping Site - L</a>
            <a class="shop-btn" href="https://google.com" target="_blank">Best Dealing Shop - M</a>
            <a class="shop-btn" href="https://google.com" target="_blank">Best Dealing Shop - N</a>
            <a class="shop-btn" href="https://google.com" target="_blank">Best Shopping Site - N (All)</a>
            <a class="shop-btn" href="https://google.com" target="_blank">Best Shopping Site - I</a>
            <a class="shop-btn" href="https://google.com" target="_blank">Best Shopping Site - 2B</a>
        </div>
    </div>

</body>
</html>
