<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .profile-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .photo-box {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 20px;
            overflow: hidden;
            border: 3px solid #007bff;
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .animated-text {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            animation: fadeIn 2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .middle-container {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 16px;
            color: #555;
        }

        .call-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .call-btn {
            display: inline-block;
            padding: 12px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .call-btn:hover {
            background-color: #0056b3;
        }

        .qr-container {
            margin-top: 25px;
            padding: 15px;
            border: 2px dashed #ccc;
            border-radius: 10px;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .qr-box {
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
        }

        .qr-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .qr-text {
            margin-top: 8px;
            font-size: 14px;
            color: #666;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        
        <!-- ১. ফটো সেকশন (অনলাইন ছবি) -->
        <div class="photo-box">
            <img src="https://unsplash.com" alt="Profile Photo">
        </div>

        <div class="animated-text">আপনার নাম এখানে</div>

        <div class="middle-container">
            এখানে আপনার অন্যান্য প্রয়োজনীয় তথ্য বা সুন্দর বিবরণ রয়েছে।
        </div>

        <div class="call-container">
            <a href="tel:প্রথম-নম্বর-এখানে" class="call-btn">📞 কল করুন: নম্বর ১</a>
            <a href="tel:দ্বিতীয়-নম্বর-এখানে" class="call-btn">📞 কল করুন: নম্বর ২</a>
        </div>

        <!-- ২. কিউআর কোড সেকশন (লাইভ অনলাইন QR) -->
        <div class="qr-container">
            <div class="qr-box">
                <img src="https://qrserver.com" alt="QR Code">
            </div>
            <div class="qr-text">স্ক্যান করুন</div>
        </div>

    </div>

</body>
</html>
