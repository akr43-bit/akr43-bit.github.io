
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Interactive Signature - Ultimate Masterpiece</title>

<style>
body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    background-color: #0f172a;
    color: #f8fafc;
    text-align: center;
    margin: 0;
    padding: 20px 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
}

.box-container {
    background: #1e293b;
    padding: 40px 30px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3),
                0 0 50px rgba(0,82,204,0.15);
    max-width: 440px;
    width: 90%;
    min-height: 260px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border: 1px solid #334155;
    position: relative;
    box-sizing: border-box;
}

.cinema-scene {
    opacity: 0;
    transform: translateY(10px) scale(0.98);
    animation: cinemaFadeInOut 2.2s cubic-bezier(0.4,0,0.2,1) forwards;
    width: 100%;
}

@keyframes cinemaFadeInOut {
    0% { opacity: 0; transform: translateY(10px) scale(0.98); }
    12% { opacity: 1; transform: translateY(0) scale(1); }
    88% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-10px) scale(1.02); }
}

.section-heading {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #38bdf8;
    margin-bottom: 12px;
    display: block;
}

.code-window {
    background: #090d16;
    color: #4ade80;
    padding: 15px;
    border-radius: 8px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    text-align: left;
    margin: 0;
    border-left: 4px solid #0052cc;
    overflow-x: auto;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
}

.css-accent {
    color: #f43f5e;
    border-left-color: #f43f5e;
}

.js-accent {
    color: #eab308;
    border-left-color: #eab308;
}

.main-name {
    font-size: 26px;
    font-weight: 800;
    background: linear-gradient(to right,#ffffff,#94a3b8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0;
    letter-spacing: 0.5px;
}

.sub-title {
    font-size: 16px;
    font-weight: 600;
    color: #38bdf8;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 5px 0 0;
}

.hidden {
    display: none !important;
}

.intro-title {
    color: #38bdf8;
    margin: 0 0 20px;
    font-size: 36px;
    font-weight: 800;
    letter-spacing: 2px;
}

.glow-btn {
    background: linear-gradient(135deg,#0052cc 0%,#1d4ed8 100%);
    color: #ffffff;
    border: none;
    padding: 14px 36px;
    font-size: 16px;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,82,204,0.4);
    transition: all 0.3s ease;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.glow-btn:active {
    transform: scale(0.96);
}

.grand-card {
    display: flex;
    align-items: center;
    text-align: left;
    background: linear-gradient(135deg,#1e293b 0%,#0f172a 100%);
    border: 1px solid #3b82f6;
    padding: 20px;
    border-radius: 14px;
    width: 100%;
    box-sizing: border-box;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    animation: grandReveal 0.8s cubic-bezier(0.16,1,0.3,1) forwards;
}

@keyframes grandReveal {
    0% { opacity: 0; transform: translateY(15px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}

.avatar-frame {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #334155;
    margin-right: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    color: #94a3b8;
    border: 3px solid #3b82f6;
    flex-shrink: 0;
    box-shadow: 0 0 15px rgba(59,130,246,0.3);
    overflow: hidden;
}

.card-details {
    text-align: left;
    min-width: 0;
}

.card-details h3 {
    margin: 0 0 4px;
    color: #ffffff;
    font-size: 19px;
    font-weight: 700;
}

.card-details p {
    margin: 0 0 6px;
    color: #38bdf8;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
}

.card-details span {
    color: #94a3b8;
    font-size: 11px;
    display: block;
    line-height: 1.4;
    margin-bottom: 12px;
}

.contact-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
}

.whatsapp-connect-btn,
.email-connect-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3px;
    box-sizing: border-box;
    transition: transform 0.2s ease;
}

.whatsapp-connect-btn {
    background-color: #25d366;
    box-shadow: 0 4px 10px rgba(37,211,102,0.3);
}

.email-connect-btn {
    background: linear-gradient(135deg,#0052cc,#2563eb);
    box-shadow: 0 4px 10px rgba(37,99,235,0.3);
}

.whatsapp-connect-btn:active,
.email-connect-btn:active {
    transform: scale(0.96);
}

@media (max-width: 380px) {
    .box-container {
        padding: 25px 15px;
    }

    .grand-card {
        padding: 14px 10px;
    }

    .avatar-frame {
        width: 64px;
        height: 64px;
        margin-right: 12px;
    }

    .card-details h3 {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="box-container">

    <div id="start-stage">
        <h2 class="intro-title">HTML</h2>
        <button class="glow-btn" onclick="runGlobalMasterpiece()">Run</button>
    </div>

    <div id="cinema-stage" class="hidden"></div>

</div>

<script>
const globalScript = [
    {
        type: 'scene',
        content: '<span class="section-heading">1. HTML Structure</span><pre class="code-window"><code>&lt;div class="global-card"&gt;\n  &lt;h2&gt;Asim Krishna Roy&lt;/h2&gt;\n&lt;/div&gt;</code></pre>'
    },
    {
        type: 'scene',
        content: '<span class="section-heading" style="color:#f43f5e;">2. CSS Styling</span><pre class="code-window css-accent"><code>.global-card {\n  background: #1e293b;\n  animation: movieFade 2s;\n}</code></pre>'
    },
    {
        type: 'scene',
        content: '<span class="section-heading" style="color:#eab308;">3. JavaScript Logic</span><pre class="code-window js-accent"><code>function init() {\n  loopSignature();\n  connectGlobally();\n}</code></pre>'
    },
    {
        type: 'scene',
        content: '<h3 class="main-name">Mr. Asim Krishna Roy</h3>'
    },
    {
        type: 'scene',
        content: '<p class="sub-title">Global Marketing Specialist</p>'
    },
    {
        type: 'final',
        content: `
            <div class="grand-card">
                <div class="avatar-frame">
                    <img src="https://i.postimg.cc/K4XqYGKj/f2626ef5-74cc-4681-b0b1-c913b7dcc139-20260715-145941-0000.png"
                         alt="Asim Krishna Roy"
                         style="width:100%;height:100%;object-fit:cover;border-radius:50%;">
                </div>

                <div class="card-details">
                    <h3>Mr. Asim Krishna Roy</h3>
                    <p>Global Marketing Specialist</p>
                    <span>Clickable Email Signature &amp;<br>Digital Business Card Services</span>

                    <div class="contact-buttons">
                        <a href="https://wa.me/919775116933"
                           target="_blank"
                           rel="noopener noreferrer"
                           class="whatsapp-connect-btn">✉️ Globally Connect</a>

                        <a href="mailto:asimkroy43@gmail.com"
                           class="email-connect-btn">✉ Email</a>
                    </div>
                </div>
            </div>
        `
    }
];

function runGlobalMasterpiece() {
    document.getElementById('start-stage').classList.add('hidden');

    const cinemaStage = document.getElementById('cinema-stage');
    cinemaStage.classList.remove('hidden');
    cinemaStage.innerHTML = '';

    let currentSceneIndex = 0;

    function playNextScene() {
        if (currentSceneIndex < globalScript.length) {
            const currentScene = globalScript[currentSceneIndex];

            if (currentScene.type === 'final') {
                cinemaStage.innerHTML = currentScene.content;

                setTimeout(function() {
                    resetToCinemaOrigin();
                }, 7000);

            } else {
                cinemaStage.innerHTML =
                    `<div class="cinema-scene">${currentScene.content}</div>`;

                currentSceneIndex++;
                setTimeout(playNextScene, 2200);
            }
        }
    }

    playNextScene();
}

function resetToCinemaOrigin() {
    const cinemaStage = document.getElementById('cinema-stage');
    cinemaStage.classList.add('hidden');
    cinemaStage.innerHTML = '';

    const startStage = document.getElementById('start-stage');
    startStage.classList.remove('hidden');
}
</script>

</body>
</html>
