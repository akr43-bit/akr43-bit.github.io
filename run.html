<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Interactive Signature - Ultimate Masterpiece</title>

<!-- ========================================== -->
<!--                 CSS PORTION                -->
<!-- ========================================== -->
<style>
/* গ্লোবাল এবং প্রিমিয়াম ব্যাকগ্রাউন্ড স্টাইলিং */
body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    background-color: #0f172a; /* ডার্ক থিম - যা কোডিং এবং সিনেমা ফিল দেয় */
    color: #f8fafc;
    text-align: center;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.box-container {
    background: #1e293b;
    padding: 40px 30px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3), 0 0 50px rgba(0, 82, 204, 0.15);
    max-width: 440px;
    width: 90%;
    min-height: 260px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border: 1px solid #334155;
    position: relative;
    box-sizing: border-box;
}

/* সিনেমার মতো ফেড-ইন এবং ফেড-আউট অ্যানিমেশন */
.cinema-scene {
    opacity: 0;
    transform: translateY(10px) scale(0.98);
    animation: cinemaFadeInOut 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    width: 100%;
}
@keyframes cinemaFadeInOut {
    0% { opacity: 0; transform: translateY(10px) scale(0.98); }
    12% { opacity: 1; transform: translateY(0) scale(1); }
    88% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-10px) scale(1.02); }
}

/* হেডিং স্টাইল (HTML, CSS, JS পরিষ্কার বোঝার জন্য) */
.section-heading {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #38bdf8;
    margin-bottom: 12px;
    display: block;
}

/* ব্ল্যাক বক্স কোড ডিসপ্লে */
.code-window {
    background: #090d16;
    color: #4ade80;
    padding: 15px;
    border-radius: 8px;
    font-family: 'Fira Code', 'Courier New', monospace;
    font-size: 11px;
    text-align: left;
    margin: 0;
    border-left: 4px solid #0052cc;
    overflow-x: auto;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
}
.css-accent { color: #f43f5e; border-left-color: #f43f5e; }
.js-accent { color: #eab308; border-left-color: #eab308; }

/* ট্রেইলর টেক্সট স্টাইল */
.main-name {
    font-size: 26px;
    font-weight: 800;
    background: linear-gradient(to right, #ffffff, #94a3b8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0;
    letter-spacing: 0.5px;
}
.sub-title {
    font-size: 16px;
    font-weight: 600;
    color: #38bdf8;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 5px 0 0 0;
}

/* শুরুর ইন্ট্রো স্ক্রিন ডিজাইন */
.hidden { display: none !important; }
.intro-title {
    color: #38bdf8;
    margin: 0 0 20px 0;
    font-size: 36px;
    font-weight: 800;
    letter-spacing: 2px;
}
.glow-btn {
    background: linear-gradient(135deg, #0052cc 0%, #1d4ed8 100%);
    color: #ffffff;
    border: none;
    padding: 14px 36px;
    font-size: 16px;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,82,204,0.4);
    transition: all 0.3s ease;
    letter-spacing: 1px;
    text-transform: uppercase;
}
.glow-btn:active {
    transform: scale(0.96);
}

/* ফাইনাল গ্র্যান্ড রূপের ডিজাইন (The Ultimate Card) */
.grand-card {
    display: flex;
    align-items: center;
    text-align: left;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border: 1px solid #3b82f6;
    padding: 20px;
    border-radius: 14px;
    width: 100%;
    box-sizing: border-box;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    animation: grandReveal  0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes grandReveal {
    0% { opacity: 0; transform: translateY(15px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}
.avatar-frame {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #334155;
    margin-right: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    color: #94a3b8;
    border: 3px solid #3b82f6;
    flex-shrink: 0;
    box-shadow: 0 0 15px rgba(59,130,246,0.3);
}
.card-details { text-align: left; }
.card-details h3 { margin: 0 0 4px 0; color: #ffffff; font-size: 19px; font-weight: 700; }
.card-details p { margin: 0 0 6px 0; color: #38bdf8; font-size: 13px; font-weight: 600; text-transform: uppercase; }
.card-details span { color: #94a3b8; font-size: 11px; display: block; line-height: 1.4; margin-bottom: 12px; }

/* গ্লোবাল হোয়াটসঅ্যাপ ডিরেক্ট বাটন */
.whatsapp-connect-btn {
    display: inline-flex;
    align-items: center;
    background-color: #25d366;
    color: #ffffff;
    text-decoration: none;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    box-shadow: 0 4px 10px rgba(37,211,102,0.3);
    letter-spacing: 0.5px;
}
</style>
</head>
<body>

<!-- ========================================== -->
<!--                 HTML PORTION               -->
<!-- ========================================== -->
<div class="box-container">
    
    <!-- স্টেপ ১: আদি অবস্থান (HTML + Run) -->
    <div id="start-stage">
        <h2 class="intro-title">HTML</h2>
        <button class="glow-btn" onclick="runGlobalMasterpiece()">Run</button>
    </div>

    <!-- স্টেপ ২: সিনেমাটিক ডিসপ্লে স্টেজ -->
    <div id="cinema-stage" class="hidden"></div>

</div>

<!-- ========================================== -->
<!--              JAVASCRIPT PORTION            -->
<!-- ========================================== -->
<script>
// সিনেমার পূর্ণাঙ্গ স্ক্রিপ্ট এবং সিকোয়েন্স ডেটা
const globalScript = [
    { 
        type: 'scene', 
        content: '<span class="section-heading">1. HTML Structure</span><pre class="code-window"><code>&lt;div class="global-card"&gt;\n  &lt;h2&gt;Asim Krishna Roy&lt;/h2&gt;\n&lt;/div&gt;</code></pre>' 
    },
    { 
        type: 'scene', 
        content: '<span class="section-heading" style="color:#f43f5e;">2. CSS Styling</span><pre class="code-window css-accent"><code>.global-card {\n  background: #1e293b;\n  animation: movieFade 2s;\n}</code></pre>' 
    },
    { 
        type: 'scene', 
        content: '<span class="section-heading" style="color:#eab308;">3. JavaScript Logic</span><pre class="code-window js-accent"><code>function init() {\n  loopSignature();\n  connectGlobally();\n}</code></pre>' 
    },
    { 
        type: 'scene', 
        content: '<h3 class="main-name">Mr. Asim Krishna Roy</h3>' 
    },
    { 
        type: 'scene', 
        content: '<p class="sub-title">Global Marketing Specialist</p>' 
    },
    { 
        type: 'final', 
        content: `
            <div class="grand-card">
                <div class="avatar-frame">PHOTO</div>
                <div class="card-details">
                    <h3>Mr. Asim Krishna Roy</h3>
                    <p>Global Marketing Specialist</p>
                    <span>Clickable Email Signature &<br>Digital Business Card Services</span>
                    <a href="https://wa.me" target="_blank" class="whatsapp-connect-btn">✉️ Globally Connect</a>
                </div>
            </div>
        `
    }
];

function runGlobalMasterpiece() {
    // ১. বাটনে ক্লিক করলেই প্রথম স্ক্রিন সম্পূর্ণ হাইড হবে
    document.getElementById('start-stage').classList.add('hidden');
    
    const cinemaStage = document.getElementById('cinema-stage');
    cinemaStage.classList.remove('hidden');
    cinemaStage.innerHTML = '';
    
    let currentSceneIndex = 0;

    function playNextScene() {
        if (currentSceneIndex < globalScript.length) {
            const currentScene = globalScript[currentSceneIndex];
            
            if (currentScene.type === 'final') {
                // গ্র্যান্ড ক্লাইম্যাক্স: আপনার সম্পূর্ণ প্রসিদ্ধমান কার্ড ফুটে উঠবে
                cinemaStage.innerHTML = currentScene.content;
                
                // আপনার নিখুঁত শর্ত: ৭ সেকেন্ড পূর্ণাঙ্গ রূপটি হোল্ড করে নিজে থেকেই একদম প্রথম অবস্থায় রিসেট হবে
                setTimeout(function() {
                    resetToCinemaOrigin();
                }, 7000); 
                
            } else {
                // সিনেমার মতো এক একটা কোড হেডিং সহ এবং নাম আসবে ও ভ্যানিশ হবে
                cinemaStage.innerHTML = `<div class="cinema-scene">${currentScene.content}</div>`;
                currentSceneIndex++;
                
                // প্রতিটি সিনের টাইমিং (২.২ সেকেন্ড) যা অ্যানিমেশনের সাথে একদম নিখুঁত
                setTimeout(playNextScene, 2200);
            }
        }
    }

    playNextScene();
}

function resetToCinemaOrigin() {
    // সম্পূর্ণ স্বয়ংক্রিয় রিসেট—স্ক্রিন ক্লিয়ার করে আবার শুরুর "HTML" এবং "Run" বাটনে ১০০% সফল প্রত্যাবর্তন
    const cinemaStage = document.getElementById('cinema-stage');
    cinemaStage.classList.add('hidden');
    cinemaStage.innerHTML = ''; 
    
    const startStage = document.getElementById('start-stage');
    startStage.classList.remove('hidden');
}
</script>

</body>
</html>
